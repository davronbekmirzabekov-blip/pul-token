<script>

  /* =========================
     Удаляем utm_source из URL
  ========================= */

  (() => {
    const url = new URL(window.location.href);

    if (url.searchParams.has("utm_source")) {
      url.searchParams.delete("utm_source");

      const cleanUrl =
        url.pathname +
        (
          url.searchParams.toString()
            ? "?" + url.searchParams.toString()
            : ""
        ) +
        url.hash;

      window.history.replaceState(
        {},
        document.title,
        cleanUrl
      );
    }
  })();


  const CONTRACT =
    "0x756e1Dcb797968AA1d4ED0571A5E64576E8a8a76";

  const SEPOLIA_CHAIN_ID =
    "0xaa36a7";


  const RPCS = [
    "https://ethereum-sepolia-rpc.publicnode.com",
    "https://eth-sepolia.api.onfinality.io/public",
    "https://rpc.sepolia.ethpandaops.io"
  ];


  const BLOCKSCOUT =
    "https://eth-sepolia.blockscout.com";


  let currentAccount = null;

  let currentLang =
    localStorage.getItem("pul-language") ||
    "ru";


  function applyLanguage(){

    document.documentElement.lang =
      currentLang;


    document
      .querySelectorAll(
        "[data-ru][data-en]"
      )
      .forEach(el => {

        el.textContent =
          currentLang === "ru"
            ? el.dataset.ru
            : el.dataset.en;

      });


    document.getElementById(
      "langBtn"
    ).textContent =
      currentLang === "ru"
        ? "EN"
        : "RU";


    const refreshBtn =
      document.getElementById(
        "refreshHistoryBtn"
      );


    if(
      refreshBtn &&
      !refreshBtn.textContent.includes("...")
    ){

      refreshBtn.textContent =
        currentLang === "ru"
          ? "Обновить"
          : "Refresh";

    }

  }


  document
    .getElementById("langBtn")
    .addEventListener(
      "click",
      () => {

        currentLang =
          currentLang === "ru"
            ? "en"
            : "ru";


        localStorage.setItem(
          "pul-language",
          currentLang
        );


        applyLanguage();

      }
    );


  function shortAddress(address){

    return address
      ? address.slice(0,8) +
        "..." +
        address.slice(-6)
      : "—";

  }


  function formatNumber(
    value,
    maximumFractionDigits = 4
  ){

    return new Intl.NumberFormat(
      currentLang === "ru"
        ? "ru-RU"
        : "en-US",
      {
        maximumFractionDigits
      }
    ).format(value);

  }


  function formatTokenAmount(value){

    const n =
      Number(value);


    return Number.isFinite(n)
      ? formatNumber(n,6)
      : "—";

  }


  function setStatus(
    element,
    message,
    type = ""
  ){

    element.textContent =
      message;


    element.className =
      "status " +
      type;

  }


  async function rpcRequest(
    url,
    method,
    params = []
  ){

    const controller =
      new AbortController();


    const timer =
      setTimeout(
        () => controller.abort(),
        7000
      );


    try{

      const response =
        await fetch(
          url,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              jsonrpc:"2.0",
              id:Date.now(),
              method,
              params
            }),

            signal:
              controller.signal
          }
        );


      if(!response.ok){

        throw new Error(
          "RPC HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if(data.error){

        throw new Error(
          data.error.message ||
          "RPC error"
        );

      }


      return data.result;

    }finally{

      clearTimeout(timer);

    }

  }


  async function rpc(
    method,
    params = []
  ){

    let lastError =
      null;


    for(
      const url of RPCS
    ){

      try{

        return await rpcRequest(
          url,
          method,
          params
        );

      }catch(error){

        lastError =
          error;

      }

    }


    throw (
      lastError ||
      new Error(
        "No RPC available"
      )
    );

  }


  async function getTokenBalance(
    address
  ){

    const cleanAddress =
      address
        .replace(/^0x/,"")
        .toLowerCase();


    const data =
      "0x70a08231" +
      cleanAddress.padStart(
        64,
        "0"
      );


    const result =
      await rpc(
        "eth_call",
        [
          {
            to:CONTRACT,
            data
          },
          "latest"
        ]
      );


    if(!result){

      return 0;

    }


    const raw =
      BigInt(result);


    const whole =
      raw /
      1000000000000000000n;


    const fraction =
      raw %
      1000000000000000000n;


    const combined =
      whole.toString() +
      "." +
      fraction
        .toString()
        .padStart(
          18,
          "0"
        );


    return Number(
      combined
    );

  }


  async function loadTotalSupply(){

    const element =
      document.getElementById(
        "totalSupply"
      );


    try{

      const result =
        await rpc(
          "eth_call",
          [
            {
              to:CONTRACT,
              data:"0x18160ddd"
            },
            "latest"
          ]
        );


      const raw =
        BigInt(result);


      const whole =
        raw /
        1000000000000000000n;


      const fraction =
        raw %
        1000000000000000000n;


      element.textContent =
        fraction === 0n
          ? formatNumber(
              Number(whole),
              0
            )
          : formatNumber(
              Number(raw) /
              1e18,
              6
            );

    }catch(error){

      element.textContent =
        "1,000,000,000";

    }

  }


  async function fetchWithTimeout(
    url,
    timeout = 8000
  ){

    const controller =
      new AbortController();


    const timer =
      setTimeout(
        () => controller.abort(),
        timeout
      );


    try{

      const response =
        await fetch(
          url,
          {
            cache:"no-store",
            signal:
              controller.signal
          }
        );


      if(!response.ok){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return await response.json();

    }finally{

      clearTimeout(timer);

    }

  }


  async function loadStats(){

    const holdersElement =
      document.getElementById(
        "holders"
      );


    const transfersElement =
      document.getElementById(
        "transfers"
      );


    try{

      const data =
        await fetchWithTimeout(
          BLOCKSCOUT +
          "/api/v2/tokens/" +
          CONTRACT +
          "/counters"
        );


      holdersElement.textContent =
        data?.token_holders_count !== undefined
          ? formatNumber(
              Number(
                data.token_holders_count
              ),
              0
            )
          : "—";


      transfersElement.textContent =
        data?.transfers_count !== undefined
          ? formatNumber(
              Number(
                data.transfers_count
              ),
              0
            )
          : "—";

    }catch(error){

      holdersElement.textContent =
        "—";

      transfersElement.textContent =
        "—";

    }

  }


  function renderHistoryItems(
    items
  ){

    const container =
      document.getElementById(
        "historyList"
      );


    if(!items.length){

      container.innerHTML =
        `
        <div class="status">
          ${
            currentLang === "ru"
              ? "Переводы пока не найдены."
              : "No transfers found yet."
          }
        </div>
        `;

      return;

    }


    container.innerHTML =
      "";


    items
      .slice(0,20)
      .forEach(item => {

        const from =
          item.from?.hash ||
          "";


        const to =
          item.to?.hash ||
          "";


        const rawValue =
          item.total?.value ||
          "0";


        const decimals =
          Number(
            item.total?.decimals ??
            18
          );


        const amount =
          Number(
            rawValue
          ) /
          Math.pow(
            10,
            decimals
          );


        const txHash =
          item.transaction_hash ||
          "";


        const timestamp =
          item.timestamp
            ? new Date(
                item.timestamp
              ).toLocaleString(
                currentLang === "ru"
                  ? "ru-RU"
                  : "en-US"
              )
            : "";


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        div.innerHTML =
          `
          <div class="history-main">

            <div class="history-type">
              ${
                currentLang === "ru"
                  ? "Перевод PUL"
                  : "PUL transfer"
              }
            </div>

            <div class="history-address">
              ${
                currentLang === "ru"
                  ? "От: "
                  : "From: "
              }${
                from
                  ? shortAddress(from)
                  : "—"
              }
            </div>

            <div class="history-address">
              ${
                currentLang === "ru"
                  ? "Кому: "
                  : "To: "
              }${
                to
                  ? shortAddress(to)
                  : "—"
              }
            </div>

            ${
              timestamp
                ? `
                  <div
                    class="history-address"
                    style="margin-top:4px">
                    ${timestamp}
                  </div>
                `
                : ""
            }

            ${
              txHash
                ? `
                  <a
                    class="history-link"
                    href="${BLOCKSCOUT}/tx/${txHash}"
                    target="_blank"
                    rel="noopener">
                    ${
                      currentLang === "ru"
                        ? "Открыть транзакцию ↗"
                        : "Open transaction ↗"
                    }
                  </a>
                `
                : ""
            }

          </div>

          <div class="history-amount">
            ${
              formatTokenAmount(
                amount
              )
            } PUL
          </div>
          `;


        container.appendChild(
          div
        );

      });

  }


  async function loadHistory(){

    const container =
      document.getElementById(
        "historyList"
      );


    try{

      const data =
        await fetchWithTimeout(
          BLOCKSCOUT +
          "/api/v2/tokens/" +
          CONTRACT +
          "/transfers"
        );


      const items =
        Array.isArray(
          data?.items
        )
          ? data.items.filter(
              item =>
                !item.token_type ||
                item.token_type ===
                  "ERC-20"
            )
          : [];


      renderHistoryItems(
        items
      );

    }catch(error){

      container.innerHTML =
        `
        <div class="status">

          ${
            currentLang === "ru"
              ? "История временно недоступна. Откройте Blockscout для просмотра переводов."
              : "History is temporarily unavailable. Open Blockscout to view transfers."
          }

          <br><br>

          <a
            href="${BLOCKSCOUT}/token/${CONTRACT}"
            target="_blank"
            rel="noopener"
            style="color:var(--blue2)">
            Blockscout ↗
          </a>

        </div>
        `;

    }

  }


  async function loadEthBalance(
    address
  ){

    try{

      const result =
        await rpc(
          "eth_getBalance",
          [
            address,
            "latest"
          ]
        );


      const wei =
        BigInt(result);


      const whole =
        wei /
        1000000000000000000n;


      const fraction =
        wei %
        1000000000000000000n;


      const value =
        Number(
          whole.toString() +
          "." +
          fraction
            .toString()
            .padStart(
              18,
              "0"
            )
        );


      document.getElementById(
        "ethBalance"
      ).textContent =
        formatNumber(
          value,
          6
        );

    }catch(error){

      document.getElementById(
        "ethBalance"
      ).textContent =
        "—";

    }

  }


  async function refreshWallet(
    address
  ){

    currentAccount =
      address;


    document.getElementById(
      "walletAddress"
    ).textContent =
      address;


    try{

      document.getElementById(
        "walletBalance"
      ).textContent =
        formatNumber(
          await getTokenBalance(
            address
          ),
          6
        );

    }catch(error){

      document.getElementById(
        "walletBalance"
      ).textContent =
        "—";

    }


    await loadEthBalance(
      address
    );

  }


  async function connectWallet(){

    const status =
      document.getElementById(
        "walletStatus"
      );


    if(!window.ethereum){

      setStatus(
        status,
        currentLang === "ru"
          ? "MetaMask не найден. Установите MetaMask."
          : "MetaMask was not found. Please install MetaMask.",
        "error"
      );

      return;

    }


    try{

      const accounts =
        await window.ethereum.request({
          method:
            "eth_requestAccounts"
        });


      if(!accounts.length){

        return;

      }


      let chainId =
        await window.ethereum.request({
          method:"eth_chainId"
        });


      if(
        chainId.toLowerCase() !==
        SEPOLIA_CHAIN_ID
      ){

        try{

          await window.ethereum.request({
            method:
              "wallet_switchEthereumChain",

            params:[
              {
                chainId:
                  SEPOLIA_CHAIN_ID
              }
            ]
          });

        }catch(switchError){

          if(
            switchError.code ===
            4902
          ){

            await window.ethereum.request({
              method:
                "wallet_addEthereumChain",

              params:[
                {
                  chainId:
                    SEPOLIA_CHAIN_ID,

                  chainName:
                    "Ethereum Sepolia",

                  nativeCurrency:{
                    name:
                      "Sepolia Ether",

                    symbol:
                      "ETH",

                    decimals:
                      18
                  },

                  rpcUrls:[
                    RPCS[0]
                  ],

                  blockExplorerUrls:[
                    BLOCKSCOUT
                  ]
                }
              ]
            });

          }else{

            throw switchError;

          }

        }


        chainId =
          await window.ethereum.request({
            method:
              "eth_chainId"
          });

      }


      if(
        chainId.toLowerCase() !==
        SEPOLIA_CHAIN_ID
      ){

        throw new Error(
          currentLang === "ru"
            ? "Переключитесь на Ethereum Sepolia в MetaMask."
            : "Switch MetaMask to Ethereum Sepolia."
        );

      }


      await refreshWallet(
        accounts[0]
      );


      document.getElementById(
        "connectBtn"
      ).textContent =
        shortAddress(
          accounts[0]
        );


      setStatus(
        status,
        currentLang === "ru"
          ? "Кошелёк подключён."
          : "Wallet connected.",
        "success"
      );


    }catch(error){

      setStatus(
        status,
        error?.message ||
          (
            currentLang === "ru"
              ? "Не удалось подключить кошелёк."
              : "Could not connect wallet."
          ),
        "error"
      );

    }

  }


  document
    .getElementById("connectBtn")
    .addEventListener(
      "click",
      connectWallet
    );


  function parsePulAmount(
    value
  ){

    const input =
      String(value)
        .trim()
        .replace(",",".");


    if(
      !/^\d+(?:\.\d{1,18})?$/.test(
        input
      )
    ){

      throw new Error(
        currentLang === "ru"
          ? "Введите сумму от 0 до 18 знаков после точки."
          : "Enter an amount with up to 18 decimal places."
      );

    }


    const [
      wholePart,
      fractionPart = ""
    ] =
      input.split(".");


    const whole =
      BigInt(
        wholePart
      );


    const fraction =
      BigInt(
        (
          fractionPart +
          "0".repeat(18)
        ).slice(0,18)
      );


    const result =
      whole *
        1000000000000000000n +
      fraction;


    if(
      result <= 0n
    ){

      throw new Error(
        currentLang === "ru"
          ? "Количество PUL должно быть больше нуля."
          : "PUL amount must be greater than zero."
      );

    }


    return result;

  }


  function showTxStatus(
    txHash,
    state
  ){

    const status =
      document.getElementById(
        "sendStatus"
      );


    const labels = {

      sent:
        currentLang === "ru"
          ? "Транзакция отправлена. Ожидаем подтверждение..."
          : "Transaction sent. Waiting for confirmation...",

      confirmed:
        currentLang === "ru"
          ? "Транзакция подтверждена."
          : "Transaction confirmed.",

      failed:
        currentLang === "ru"
          ? "Транзакция не подтверждена."
          : "Transaction failed.",

      pending:
        currentLang === "ru"
          ? "Проверяем статус транзакции..."
          : "Checking transaction status..."

    };


    status.className =
      "status " +
      (
        state === "confirmed"
          ? "success"
          : state === "failed"
            ? "error"
            : ""
      );


    status.innerHTML =
      "<div>" +
      labels[state] +
      "</div>";


    if(txHash){

      const link =
        document.createElement(
          "a"
        );


      link.href =
        BLOCKSCOUT +
        "/tx/" +
        txHash;


      link.target =
        "_blank";


      link.rel =
        "noopener";


      link.className =
        "history-link tx-status";


      link.textContent =
        currentLang === "ru"
          ? "Открыть транзакцию ↗"
          : "Open transaction ↗";


      status.appendChild(
        link
      );

    }

  }


  async function waitForReceipt(
    txHash
  ){

    for(
      let i=0;
      i<30;
      i++
    ){

      try{

        const receipt =
          await window.ethereum.request({
            method:
              "eth_getTransactionReceipt",

            params:[
              txHash
            ]
          });


        if(receipt){

          if(
            receipt.status ===
            "0x1"
          ){

            return true;

          }


          if(
            receipt.status ===
            "0x0"
          ){

            return false;

          }

        }

      }catch(error){

        console.log(
          "Receipt check:",
          error
        );

      }


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            3000
          )
      );

    }


    return null;

  }


  async function sendPUL(){

    const status =
      document.getElementById(
        "sendStatus"
      );


    const recipient =
      document.getElementById(
        "recipient"
      ).value.trim();


    const amount =
      document.getElementById(
        "amount"
      ).value.trim();


    if(!window.ethereum){

      setStatus(
        status,
        currentLang === "ru"
          ? "Сначала установите MetaMask."
          : "Please install MetaMask first.",
        "error"
      );

      return;

    }


    if(!currentAccount){

      setStatus(
        status,
        currentLang === "ru"
          ? "Сначала подключите MetaMask."
          : "Connect MetaMask first.",
        "error"
      );

      return;

    }


    if(
      !/^0x[a-fA-F0-9]{40}$/.test(
        recipient
      )
    ){

      setStatus(
        status,
        currentLang === "ru"
          ? "Введите корректный адрес Ethereum."
          : "Enter a valid Ethereum address.",
        "error"
      );

      return;

    }


    let tokenAmount;


    try{

      tokenAmount =
        parsePulAmount(
          amount
        );

    }catch(error){

      setStatus(
        status,
        error.message,
        "error"
      );

      return;

    }


    try{

      setStatus(
        status,
        currentLang === "ru"
          ? "Подтвердите транзакцию в MetaMask..."
          : "Confirm the transaction in MetaMask..."
      );


      const data =
        "0xa9059cbb" +
        recipient
          .replace(
            /^0x/,
            ""
          )
          .toLowerCase()
          .padStart(
            64,
            "0"
          ) +
        tokenAmount
          .toString(16)
          .padStart(
            64,
            "0"
          );


      const txHash =
        await window.ethereum.request({

          method:
            "eth_sendTransaction",

          params:[
            {
              from:
                currentAccount,

              to:
                CONTRACT,

              data
            }
          ]

        });


      document.getElementById(
        "amount"
      ).value = "";


      document.getElementById(
        "recipient"
      ).value = "";


      showTxStatus(
        txHash,
        "sent"
      );


      const result =
        await waitForReceipt(
          txHash
        );


      if(
        result === true
      ){

        showTxStatus(
          txHash,
          "confirmed"
        );


        await Promise.allSettled([
          loadHistory(),
          loadStats(),
          currentAccount
            ? refreshWallet(
                currentAccount
              )
            : Promise.resolve()
        ]);

      }else if(
        result === false
      ){

        showTxStatus(
          txHash,
          "failed"
        );

      }else{

        showTxStatus(
          txHash,
          "pending"
        );


        await loadHistory();

      }


    }catch(error){

      setStatus(
        status,
        error?.message ||
          (
            currentLang === "ru"
              ? "Транзакция отменена или произошла ошибка."
              : "Transaction was cancelled or failed."
          ),
        "error"
      );

    }

  }


  document
    .getElementById("sendBtn")
    .addEventListener(
      "click",
      sendPUL
    );


  if(
    window.ethereum
  ){

    window.ethereum.on(
      "accountsChanged",
      async accounts => {

        if(
          !accounts.length
        ){

          currentAccount =
            null;


          document.getElementById(
            "walletAddress"
          ).textContent =
            "—";


          document.getElementById(
            "walletBalance"
          ).textContent =
            "—";


          document.getElementById(
            "ethBalance"
          ).textContent =
            "—";


          document.getElementById(
            "connectBtn"
          ).textContent =
            currentLang === "ru"
              ? "Подключить MetaMask"
              : "Connect MetaMask";


          return;

        }


        await refreshWallet(
          accounts[0]
        );


        document.getElementById(
          "connectBtn"
        ).textContent =
          shortAddress(
            accounts[0]
          );

      }
    );


    window.ethereum.on(
      "chainChanged",
      () => {
        window.location.reload();
      }
    );

  }


  async function copyText(
    text
  ){

    if(
      !text ||
      text === "—"
    ){

      return false;

    }


    try{

      await navigator.clipboard.writeText(
        text
      );


      return true;

    }catch(error){

      const area =
        document.createElement(
          "textarea"
        );


      area.value =
        text;


      area.style.position =
        "fixed";


      area.style.opacity =
        "0";


      document.body.appendChild(
        area
      );


      area.select();


      const ok =
        document.execCommand(
          "copy"
        );


      area.remove();


      return ok;

    }

  }


  function bindCopyButton(
    buttonId,
    getValue
  ){

    const button =
      document.getElementById(
        buttonId
      );


    if(!button){

      return;

    }


    button.addEventListener(
      "click",
      async () => {

        const ok =
          await copyText(
            getValue()
          );


        const original =
          button.textContent;


        button.textContent =
          ok
            ? (
                currentLang === "ru"
                  ? "Скопировано ✓"
                  : "Copied ✓"
              )
            : original;


        setTimeout(
          () => {

            button.textContent =
              currentLang === "ru"
                ? "Скопировать адрес"
                : "Copy address";

          },
          1500
        );

      }
    );

  }


  bindCopyButton(
    "copyWalletBtn",
    () =>
      currentAccount ||
      document.getElementById(
        "walletAddress"
      ).textContent
  );


  bindCopyButton(
    "copyContractBtn",
    () =>
      CONTRACT
  );


  document
    .getElementById(
      "refreshHistoryBtn"
    )
    .addEventListener(
      "click",
      async () => {

        const btn =
          document.getElementById(
            "refreshHistoryBtn"
          );


        const old =
          btn.textContent;


        btn.textContent =
          currentLang === "ru"
            ? "Обновление..."
            : "Refreshing...";


        await Promise.allSettled([
          loadHistory(),
          loadStats()
        ]);


        btn.textContent =
          old;

      }
    );


  async function init(){

    applyLanguage();


    await Promise.allSettled([
      loadTotalSupply(),
      loadStats(),
      loadHistory()
    ]);


    if(
      window.ethereum
    ){

      try{

        const accounts =
          await window.ethereum.request({
            method:
              "eth_accounts"
          });


        if(
          accounts.length
        ){

          const chainId =
            await window.ethereum.request({
              method:
                "eth_chainId"
            });


          if(
            chainId.toLowerCase() ===
            SEPOLIA_CHAIN_ID
          ){

            await refreshWallet(
              accounts[0]
            );


            document.getElementById(
              "connectBtn"
            ).textContent =
              shortAddress(
                accounts[0]
              );

          }

        }

      }catch(error){

        console.log(
          "Wallet restore:",
          error
        );

      }

    }

  }


  init();

</script>
