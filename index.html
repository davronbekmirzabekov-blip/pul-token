<script>
document.addEventListener("DOMContentLoaded", () => {
  const CONTRACT = "0x756e1Dcb797968AA1d4ED0571A5E64576E8a8a76";
  const SEPOLIA_CHAIN_ID = "0xaa36a7";

  const RPCS = [
    "https://ethereum-sepolia-rpc.publicnode.com",
    "https://eth-sepolia.api.onfinality.io/public",
    "https://rpc.sepolia.ethpandaops.io"
  ];

  const BLOCKSCOUT = "https://eth-sepolia.blockscout.com";

  const $ = (id) => document.getElementById(id);

  const langBtn = $("langBtn");
  const connectBtn = $("connectBtn");
  const sendBtn = $("sendBtn");
  const refreshHistoryBtn = $("refreshHistoryBtn");

  let currentLang = localStorage.getItem("pul_lang") || "ru";
  let account = null;

  function safeClick(element, handler) {
    if (element) {
      element.addEventListener("click", handler);
    }
  }

  function shortAddress(address) {
    if (!address) return "";
    return address.slice(0, 6) + "..." + address.slice(-4);
  }

  function showStatus(message, type = "") {
    const el = $("status");
    if (!el) return;

    el.textContent = message;
    el.className = "status " + type;
  }

  function applyLanguage() {
    document.documentElement.lang = currentLang;

    document.querySelectorAll("[data-ru][data-en]").forEach((el) => {
      el.textContent = currentLang === "ru"
        ? el.dataset.ru
        : el.dataset.en;
    });

    if (langBtn) {
      langBtn.textContent = currentLang === "ru" ? "EN" : "RU";
    }
  }

  safeClick(langBtn, () => {
    currentLang = currentLang === "ru" ? "en" : "ru";
    localStorage.setItem("pul_lang", currentLang);
    applyLanguage();
  });

  async function getProvider() {
    if (!window.ethereum) {
      throw new Error(
        currentLang === "ru"
          ? "MetaMask не установлен"
          : "MetaMask is not installed"
      );
    }

    return window.ethereum;
  }

  async function switchToSepolia() {
    const provider = await getProvider();

    try {
      await provider.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: SEPOLIA_CHAIN_ID }]
      });
    } catch (error) {
      if (error.code === 4902) {
        await provider.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: SEPOLIA_CHAIN_ID,
            chainName: "Sepolia",
            nativeCurrency: {
              name: "Sepolia Ether",
              symbol: "ETH",
              decimals: 18
            },
            rpcUrls: [RPCS[0]],
            blockExplorerUrls: [BLOCKSCOUT]
          }]
        });
      } else {
        throw error;
      }
    }
  }

  async function connectWallet() {
    try {
      const provider = await getProvider();

      await switchToSepolia();

      const accounts = await provider.request({
        method: "eth_requestAccounts"
      });

      if (!accounts || !accounts.length) {
        throw new Error("Wallet account not found");
      }

      account = accounts[0];

      if (connectBtn) {
        connectBtn.textContent = shortAddress(account);
      }

      showStatus(
        currentLang === "ru"
          ? "Кошелёк подключён"
          : "Wallet connected",
        "success"
      );

      await refreshBalance();
    } catch (error) {
      console.error(error);

      showStatus(
        error.message ||
        (currentLang === "ru"
          ? "Не удалось подключить кошелёк"
          : "Failed to connect wallet"),
        "error"
      );
    }
  }

  safeClick(connectBtn, connectWallet);

  async function rpc(method, params = []) {
    let lastError = null;

    for (const url of RPCS) {
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: 1,
            method,
            params
          })
        });

        if (!response.ok) {
          throw new Error("RPC HTTP " + response.status);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "RPC error");
        }

        return data.result;
      } catch (error) {
        lastError = error;
      }
    }

    throw lastError || new Error("RPC unavailable");
  }

  function hexToNumber(hex) {
    return parseInt(hex || "0x0", 16);
  }

  function formatTokenAmount(hex, decimals = 18) {
    try {
      const value = BigInt(hex);
      const base = 10n ** BigInt(decimals);

      const whole = value / base;
      const fraction = value % base;

      if (fraction === 0n) {
        return whole.toString();
      }

      const fractionText = fraction
        .toString()
        .padStart(decimals, "0")
        .replace(/0+$/, "");

      return whole.toString() + "." + fractionText;
    } catch {
      return "0";
    }
  }

  async function erc20Call(data) {
    return await rpc("eth_call", [
      {
        to: CONTRACT,
        data
      },
      "latest"
    ]);
  }

  async function refreshBalance() {
    if (!account) return;

    try {
      // balanceOf(address)
      const address = account
        .toLowerCase()
        .replace(/^0x/, "")
        .padStart(64, "0");

      const data = "0x70a08231" + address;

      const result = await erc20Call(data);
      const balance = formatTokenAmount(result, 18);

      const balanceEl = $("balance");

      if (balanceEl) {
        balanceEl.textContent = balance + " PUL";
      }
    } catch (error) {
      console.error("Balance error:", error);
    }
  }

  async function refreshStats() {
    try {
      // totalSupply()
      const result = await erc20Call("0x18160ddd");
      const supply = formatTokenAmount(result, 18);

      const supplyEl = $("totalSupply");

      if (supplyEl) {
        supplyEl.textContent = supply + " PUL";
      }
    } catch (error) {
      console.error("Supply error:", error);
    }
  }

  function isValidAddress(address) {
    return /^0x[a-fA-F0-9]{40}$/.test(address);
  }

  safeClick(sendBtn, async () => {
    try {
      if (!account) {
        await connectWallet();
      }

      if (!account) return;

      const recipientEl = $("recipient");
      const amountEl = $("amount");

      const recipient = recipientEl?.value.trim();
      const amount = amountEl?.value.trim();

      if (!isValidAddress(recipient)) {
        showStatus(
          currentLang === "ru"
            ? "Введите корректный адрес получателя"
            : "Enter a valid recipient address",
          "error"
        );
        return;
      }

      if (!amount || Number(amount) <= 0) {
        showStatus(
          currentLang === "ru"
            ? "Введите сумму"
            : "Enter an amount",
          "error"
        );
        return;
      }

      await switchToSepolia();

      const provider = await getProvider();

      /*
       * ERC-20 transfer(address,uint256)
       * selector = 0xa9059cbb
       */

      const cleanAmount = amount.replace(",", ".");

      if (!/^\d+(\.\d+)?$/.test(cleanAmount)) {
        throw new Error(
          currentLang === "ru"
            ? "Некорректная сумма"
            : "Invalid amount"
        );
      }

      const [whole, fraction = ""] = cleanAmount.split(".");

      const paddedFraction = fraction
        .padEnd(18, "0")
        .slice(0, 18);

      const tokenAmount =
        BigInt(whole) * (10n ** 18n) +
        BigInt(paddedFraction || "0");

      const recipientData = recipient
        .replace(/^0x/, "")
        .padStart(64, "0");

      const amountData = tokenAmount
        .toString(16)
        .padStart(64, "0");

      const data =
        "0xa9059cbb" +
        recipientData +
        amountData;

      showStatus(
        currentLang === "ru"
          ? "Подтвердите транзакцию в MetaMask..."
          : "Confirm the transaction in MetaMask...",
        ""
      );

      const txHash = await provider.request({
        method: "eth_sendTransaction",
        params: [{
          from: account,
          to: CONTRACT,
          data
        }]
      });

      showStatus(
        currentLang === "ru"
          ? "Транзакция отправлена"
          : "Transaction sent",
        "success"
      );

      const txEl = $("txHash");

      if (txEl) {
        txEl.innerHTML =
          `<a href="${BLOCKSCOUT}/tx/${txHash}" target="_blank" rel="noopener">
            ${shortAddress(txHash)}
          </a>`;
      }

      await waitForReceipt(txHash);
      await refreshBalance();

    } catch (error) {
      console.error("Transfer error:", error);

      showStatus(
        error.message ||
        (currentLang === "ru"
          ? "Ошибка транзакции"
          : "Transaction error"),
        "error"
      );
    }
  });

  async function waitForReceipt(txHash) {
    for (let i = 0; i < 60; i++) {
      try {
        const receipt = await rpc(
          "eth_getTransactionReceipt",
          [txHash]
        );

        if (receipt) {
          if (receipt.status === "0x1") {
            showStatus(
              currentLang === "ru"
                ? "Транзакция подтверждена"
                : "Transaction confirmed",
              "success"
            );
          } else {
            showStatus(
              currentLang === "ru"
                ? "Транзакция отклонена"
                : "Transaction failed",
              "error"
            );
          }

          return receipt;
        }
      } catch (error) {
        console.error(error);
      }

      await new Promise(resolve => setTimeout(resolve, 3000));
    }
  }

  async function refreshHistory() {
    const historyEl = $("history");

    if (!historyEl) return;

    historyEl.innerHTML =
      currentLang === "ru"
        ? "Загрузка истории..."
        : "Loading history...";

    try {
      const response = await fetch(
        `${BLOCKSCOUT}/api?module=account&action=tokentx&contractaddress=${CONTRACT}&page=1&offset=20&sort=desc`
      );

      if (!response.ok) {
        throw new Error("Blockscout HTTP " + response.status);
      }

      const data = await response.json();

      if (!data.result || !Array.isArray(data.result)) {
        historyEl.textContent =
          currentLang === "ru"
            ? "История пока недоступна"
            : "History unavailable";
        return;
      }

      historyEl.innerHTML = "";

      data.result.forEach(tx => {
        const row = document.createElement("div");

        row.className = "history-row";

        const from = shortAddress(tx.from);
        const to = shortAddress(tx.to);
        const value = tx.value
          ? formatTokenAmount("0x" + BigInt(tx.value).toString(16), Number(tx.tokenDecimal || 18))
          : "0";

        row.innerHTML = `
          <div>
            <strong>${value} ${tx.tokenSymbol || "PUL"}</strong>
          </div>
          <div>
            ${from} → ${to}
          </div>
          <div>
            <a
              href="${BLOCKSCOUT}/tx/${tx.hash}"
              target="_blank"
              rel="noopener"
            >
              ${shortAddress(tx.hash)}
            </a>
          </div>
        `;

        historyEl.appendChild(row);
      });

    } catch (error) {
      console.error("History error:", error);

      historyEl.textContent =
        currentLang === "ru"
          ? "Не удалось загрузить историю"
          : "Failed to load history";
    }
  }

  safeClick(refreshHistoryBtn, refreshHistory);

  document.querySelectorAll("[data-copy]").forEach(button => {
    button.addEventListener("click", async () => {
      const value = button.dataset.copy;

      if (!value) return;

      try {
        await navigator.clipboard.writeText(value);

        const oldText = button.textContent;

        button.textContent =
          currentLang === "ru"
            ? "Скопировано"
            : "Copied";

        setTimeout(() => {
          button.textContent = oldText;
        }, 1500);

      } catch (error) {
        console.error("Copy error:", error);
      }
    });
  });

  if (window.ethereum) {
    window.ethereum.on("accountsChanged", accounts => {
      account = accounts?.[0] || null;

      if (connectBtn) {
        connectBtn.textContent = account
          ? shortAddress(account)
          : (currentLang === "ru"
              ? "Подключить"
              : "Connect");
      }

      refreshBalance();
    });

    window.ethereum.on("chainChanged", () => {
      refreshBalance();
    });
  }

  applyLanguage();
  refreshStats();
  refreshHistory();

  /*
   * Remove UTM parameters from the address bar.
   */
  try {
    const url = new URL(window.location.href);

    if (url.searchParams.has("utm_source")) {
      url.searchParams.delete("utm_source");
      window.history.replaceState({}, "", url.toString());
    }
  } catch (error) {
    console.error(error);
  }
});
</script>
